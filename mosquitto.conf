# Mosquitto Broker Configuration for Local Edge Testing
# Binds to standard port 1883 and allows external/anonymous Docker container connections

# Listen on all interfaces on port 1883
listener 1883 0.0.0.0

# Allow anonymous connections (no username/password needed for local edge tests)
allow_anonymous true

# Enable persistence of messages
persistence true
persistence_location /mosquitto/data/

# Log format and logging destination (output directly to stdout for container logs)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# WebSockets listener for browser-level subscriptions
listener 9001 0.0.0.0
protocol websockets
allow_anonymous true

